<style>

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>

/* =====================================================================

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const tamu = new URLSearchParams(location.search).get("to") || "Tamu Undangan";
const E0 = C.acara[0];

const tglPendek = new Date(E0.mulai).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });

const salin = (txt, pesan) => (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).catch(() => {
  const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove();
}).then(() => toast(pesan));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };

  { id: "editor", judul: "Surat dari editor", html: () => `<h2 class="hd">Surat dari editor</h2><p class="lead cap">Pembaca yang terhormat, ${esc(tamu)}. ${C.pembuka[0]}</p><p class="lead" style="margin-top:1rem">${C.pembuka[1]}</p><p class="sig">${A} &amp; ${B}<br><small style="font:600 .75rem var(--b)">Pemimpin redaksi seumur hidup</small></p>` },
  { id: "isi", judul: "Daftar isi", g: 1, html: () => `<h2 class="hd">Dalam edisi ini</h2><nav class="toc" aria-label="Daftar isi">${PG.map((p, i) => i === 1 ? "" : `<a href="#pg-${p.id}"><span>${p.judul}</span><i></i><b>${String(i + 3).padStart(2, "0")}</b></a>`).join("")}</nav>
    <div class="term"><p>Terbit dalam</p><div class="cd" id="cd"><div><b id="d">0</b><small>hari</small></div><div><b id="h">0</b><small>jam</small></div><div><b id="m">0</b><small>menit</small></div><div><b id="s">0</b><small>detik</small></div></div></div>` },
  { id: "utama", judul: "Cerita utama", html: () => `<h2 class="hd">Dua kepala, satu rencana</h2><div class="frm">${C.hero.map((s, i) => `<img src="${s}" alt="" ${i ? 'loading="lazy"' : ""}>`).join("")}</div><p class="fc">Foto: ${A} &amp; ${B} dalam sesi pemotretan edisi ini.</p>
    <div class="ar">${C.cerita.map((c, i) => `<p ${i ? "" : 'class="cap"'}><b>${c[0]}.</b> ${c[1]}</p>`).join("")}</div>
    <blockquote class="pq">“${C.kutipan[0]}”<cite>${C.kutipan[1]}</cite></blockquote><p style="font-style:italic;max-width:36em">${C.ayat.teks} <b>(${C.ayat.sumber})</b></p>` },
  { id: "wawancara", judul: "Wawancara eksklusif", g: 1, html: () => `<h2 class="hd">Wawancara eksklusif</h2><div class="hd2">${[C.pria, C.wanita].map(p => `<div><img src="${p.foto}" alt="${p.nama}" loading="lazy"><h3>${p.nama}</h3><p>${p.anak}</p><a class="btn o" href="${p.ig}" target="_blank" rel="noopener">Instagram</a></div>`).join("")}</div>
    ${C.qa.map(q => `<div class="qa"><h3>${q[0]}</h3><div><p><b>${A}</b>${q[1]}</p><p><b>${B}</b>${q[2]}</p></div></div>`).join("")}` },
  { id: "agenda", judul: "Agenda", html: () => `<h2 class="hd">Agenda terbit</h2>${C.acara.map((e, i) => { const d = new Date(e.mulai); return `<div class="ag"><div class="n">${String(d.getDate()).padStart(2, "0")}<small>${d.toLocaleDateString("id-ID", { month: "short", year: "numeric" })}</small></div><div><h3>${e.judul}</h3><p><b>${e.jam}</b></p><p>${e.tempat}</p><div class="row"><a class="btn" href="${e.peta}" target="_blank" rel="noopener">Buka peta</a><button class="btn o" data-ics="${i}">Simpan ke kalender</button></div></div></div>`; }).join("")}` },
  { id: "gaya", judul: "Panduan gaya", g: 1, html: () => `<h2 class="hd">Panduan gaya</h2><p class="lead">${C.dress.teks}</p><div class="sw">${C.dress.warna.map(w => `<button style="background:${w[0]};color:${w[0] === "#0E0E0E" ? "#fff" : "#0e0e0e"}" data-c="${w[0]}" aria-label="Salin warna ${w[1]} ${w[0]}">${w[1]}<br>${w[0]}</button>`).join("")}</div>` },
  { id: "lookbook", judul: "Lookbook", html: () => `<h2 class="hd">Lookbook</h2><div class="lk" id="lk">${C.galeri.map((s, i) => `<button data-i="${i}" aria-label="Perbesar foto ${i + 1}"><img src="${s}" alt="Foto ${i + 1}" loading="lazy"><small>Foto ${i + 1}</small></button>`).join("")}</div>` },
  { id: "iklan", judul: "Iklan", html: () => `<div class="ad"><h2>Tanda kasih. Bukan keharusan.</h2><p>Kehadiran dan doa Anda sudah menjadi hadiah terbaik. Bila ingin berbagi tanda kasih, kami menerimanya lewat e-wallet berikut.</p><button class="btn" id="gbtn" aria-expanded="false">Lihat nomor e-wallet</button>
    <div id="cards">${C.hadiah.map(g => `<div class="gc"><b>${g.bank}</b><p class="no">${g.no}</p><p>a.n. ${g.nama}</p><button class="btn o" data-no="${g.no}" data-b="${g.bank}">Salin nomor</button></div>`).join("")}</div></div>` },
  { id: "jajak", judul: "Jajak pendapat", g: 1, html: () => `<h2 class="hd">Jajak pendapat</h2><div class="jj" id="jj"><p class="lead" style="margin-bottom:1.4rem">${C.jajak.tanya}</p><div id="opsi"></div><small id="jinfo"></small></div>` },
  { id: "surat", judul: "Surat pembaca", html: () => `<h2 class="hd">Surat pembaca</h2><form id="f"><label><span>Nama</span><input name="nama" required maxlength="60" autocomplete="name" value="${tamu === "Tamu Undangan" ? "" : esc(tamu)}"></label>
    <div class="two"><label><span>Kehadiran</span><select name="hadir"><option>Hadir</option><option>Belum pasti</option><option>Tidak bisa hadir</option></select></label><label><span>Jumlah tamu</span><select name="jumlah"><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div>
    <label><span>Ucapan dan doa</span><textarea name="pesan" required maxlength="400"></textarea></label>
    <div class="row"><button class="btn" type="submit">Kirim surat</button><button class="btn o" type="button" id="wa">Kirim lewat WhatsApp</button></div></form><div id="list"></div>` }
];
$("#app").innerHTML = PG.map(sec).join("") + `<section class="back"><h2>Sampai jumpa di edisi berikutnya.</h2><p>${C.penutup}</p><p style="font-size:.85rem;opacity:.7">Undangan digital oleh ${C.studio}</p><div class="bar"><i></i>ISSN 2027-0814</div></section>`;

/* Musik + buka sampul */
const aud = $("#aud"), sw = $("#sw"); let on = false;
if (C.musik) aud.src = C.musik;
const musik = v => {
  on = v; sw.setAttribute("aria-checked", v); sw.textContent = v ? "Musik on" : "Musik off"; store.set("musik-" + C.id, v ? "on" : "off");
  if (!C.musik) return v && toast("URL musik belum diisi pada data undangan");
  v ? aud.play().catch(() => { on = false; sw.setAttribute("aria-checked", false); sw.textContent = "Musik off"; }) : aud.pause();
};
sw.onclick = () => musik(!on);
$("#open").onclick = () => {
  $("#cover").classList.add("out"); document.body.classList.remove("lock"); sw.style.display = "block"; $("#chip").style.display = "block";
  if (store.get("musik-" + C.id) !== "off") musik(true);
  setTimeout(() => $("#cover").style.display = "none", 1700);
};

/* Slider foto utama */
{ const im = [...$(".frm").children]; let i = 0; im[0].classList.add("on");
  setInterval(() => { im[i].classList.remove("on"); i = (i + 1) % im.length; im[i].classList.add("on"); }, 4500); }

/* Hitung mundur */
const t0 = new Date(E0.mulai).getTime();
const tick = () => {
  const d = t0 - Date.now();
  if (d <= 0) { $("#cd").innerHTML = "<div style='grid-column:1/-1'><b style='font-size:1.4rem'>Edisi ini sudah terbit hari ini</b></div>"; return clearInterval(iv); }
  $("#d").textContent = Math.floor(d / 864e5); $("#h").textContent = Math.floor(d % 864e5 / 36e5);
  $("#m").textContent = Math.floor(d % 36e5 / 6e4); $("#s").textContent = Math.floor(d % 6e4 / 1e3);
};
const iv = setInterval(tick, 1000); tick();

/* Kalender, kode warna, hadiah */
document.querySelectorAll("[data-ics]").forEach(b => b.onclick = () => {
  const e = C.acara[b.dataset.ics], f = s => s.replace(/[-:]/g, ""), x = s => s.replace(/,/g, "\\,");
  const t = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Undangan Digital//ID", "BEGIN:VEVENT", `UID:${C.id}-${b.dataset.ics}@undangan`,
    `DTSTAMP:${f(new Date().toISOString().slice(0, 19))}Z`, `DTSTART:${f(e.mulai)}`, `DTEND:${f(e.selesai)}`,
    `SUMMARY:${x(e.judul + " " + A + " & " + B)}`, `LOCATION:${x(e.tempat)}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([t], { type: "text/calendar" }));
  a.download = `${C.id}-${e.judul.toLowerCase().replace(/\s/g, "-")}.ics`; a.click(); toast("Acara disimpan ke kalender");
});
$(".sw").onclick = e => { const b = e.target.closest("button"); if (b) salin(b.dataset.c, `Warna ${b.dataset.c} disalin`); };
$("#gbtn").onclick = e => { const o = $("#cards").classList.toggle("on"); e.target.setAttribute("aria-expanded", o); };
$("#cards").onclick = e => { const b = e.target.closest("button"); if (b) salin(b.dataset.no.replace(/-/g, ""), `Nomor ${b.dataset.b} disalin`); };

/* Lightbox + geser jari */
const lb = $("#lb"), lbi = $("img", lb); let cur = 0, lx = 0;
const show = i => { cur = (i + C.galeri.length) % C.galeri.length; lbi.src = C.galeri[cur]; lb.classList.add("on"); };
$("#lk").onclick = e => { const b = e.target.closest("button"); if (b) show(+b.dataset.i); };
$(".p", lb).onclick = () => show(cur - 1); $(".n", lb).onclick = () => show(cur + 1);
$(".x", lb).onclick = () => lb.classList.remove("on");
lb.onclick = e => { if (e.target === lb) lb.classList.remove("on"); };
lb.ontouchstart = e => lx = e.touches[0].clientX;
lb.ontouchend = e => { const d = e.changedTouches[0].clientX - lx; if (Math.abs(d) > 50) show(cur + (d < 0 ? 1 : -1)); };
document.addEventListener("keydown", e => {
  if (!lb.classList.contains("on")) return;
  if (e.key === "Escape") lb.classList.remove("on"); if (e.key === "ArrowLeft") show(cur - 1); if (e.key === "ArrowRight") show(cur + 1);
});

/* BARU: jajak pendapat (suara tersimpan di browser ini) */
const JK = "jajak-" + C.id;
const drawJ = () => {
  const mine = store.get(JK + "-pilih"), hasil = loadJ(JK, C.jajak.awal.slice());
  const total = hasil.reduce((a, b) => a + b, 0) || 1, voted = mine !== null;
  $("#opsi").innerHTML = C.jajak.opsi.map((o, i) => `<button class="btn o" data-i="${i}" ${voted ? "disabled" : ""}><i class="fill" style="width:${voted ? Math.round(hasil[i] / total * 100) : 0}%"></i><span><b>${o}${voted && +mine === i ? " ✓" : ""}</b>${voted ? `<b>${Math.round(hasil[i] / total * 100)}%</b>` : ""}</span></button>`).join("");
  $("#jinfo").textContent = voted ? `Terima kasih sudah memilih. ${total} suara tercatat di browser ini.` : "Ketuk salah satu pilihan untuk melihat hasil sementara.";
};
$("#opsi").onclick = e => {
  const b = e.target.closest("button"); if (!b || b.disabled) return;
  const h = loadJ(JK, C.jajak.awal.slice()); h[+b.dataset.i]++; store.set(JK, JSON.stringify(h)); store.set(JK + "-pilih", b.dataset.i); drawJ();
};

/* Surat pembaca (tersimpan di browser pengunjung) */
const KEY = "surat-" + C.id, f = $("#f");
const load = () => loadJ(KEY, []);
const render = () => {
  const d = load();
  $("#list").innerHTML = d.length ? d.map(x => `<article><p>“${esc(x.pesan)}”</p><b>${esc(x.nama)} · ${esc(x.hadir)}, ${esc(x.jumlah)} orang</b></article>`).join("") : '<p class="empty">Belum ada surat yang masuk. Jadilah pembaca pertama yang menulis.</p>';
};
f.onsubmit = e => {
  e.preventDefault();
  const d = load(); d.unshift(Object.fromEntries(new FormData(f)));
  store.set(KEY, JSON.stringify(d));
  if (store.get(KEY) === null) return toast("Surat tidak bisa disimpan di browser ini");
  f.reset(); render(); toast("Surat Anda dimuat di edisi ini. Terima kasih!");
};
$("#wa").onclick = () => {
  if (!f.reportValidity()) return;
  const v = Object.fromEntries(new FormData(f));
  const m = `Halo, saya ${v.nama}. Saya ${v.hadir.toLowerCase()} di pernikahan ${A} & ${B} (${v.jumlah} orang).\n\n${v.pesan}`;
  window.open(`https://wa.me/${C.wa}?text=${encodeURIComponent(m)}`, "_blank", "noopener");
};
drawJ(); render();

/* Progres baca + nomor halaman */
const pages = [...document.querySelectorAll(".pg")], chip = $("#chip"), prog = $("#prog");
const upd = () => {
  prog.style.transform = `scaleX(${scrollY / Math.max(1, document.documentElement.scrollHeight - innerHeight)})`;
  let n = 3; pages.forEach(p => { if (p.getBoundingClientRect().top <= innerHeight * .4) n = p.dataset.no; });
  chip.textContent = `Halaman ${String(n).padStart(2, "0")} dari ${String(PG.length + 2).padStart(2, "0")}`;
};
addEventListener("scroll", upd, { passive: true }); upd();
</script>
</body>
</html>
